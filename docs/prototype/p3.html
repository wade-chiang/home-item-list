<style>

<script>
/* ================= Icons：Lucide 1.44.0 =================
   名稱已對 cdn.jsdelivr.net 上的 lucide@1.44.0 逐一核對存在。
   注意：Home、Trash2 是舊名稱的別名，這裡直接用新名稱 house、trash。 */
const ICON = {
  sofa:'sofa', utensils:'utensils', pot:'cooking-pot', bed:'bed-double', bedSingle:'bed-single',
  blocks:'blocks', book:'book-open', bath:'bath', sun:'sun',
  airvent:'air-vent', droplet:'droplets', box:'package', wind:'wind', fan:'fan', flame:'flame',
  washer:'washing-machine',
  plus:'plus', check:'check', x:'x', chevL:'chevron-left', chevR:'chevron-right', chevD:'chevron-down',
  gear:'settings', home:'house', list:'list', camera:'camera', image:'image', pause:'pause', play:'play',
  trash:'trash', pencil:'pencil', grip:'grip-vertical', moon:'moon', monitor:'monitor',
  sliders:'sliders-horizontal', swap:'arrow-left-right',
};
/* 先輸出固定尺寸的 <i> 佔位，createIcons 會把它換成 <svg>。
   元素上的 width / height / stroke-width 會被 Lucide 保留（它最後才合併元素屬性）。
   若 Lucide 載入失敗，佔位仍保有尺寸，版面不會跑掉，只是看不到 icon。 */
function ic(name, size=20, sw=1.75){
  return `<i data-lucide="${ICON[name]||name}" width="${size}" height="${size}" stroke-width="${sw}" style="display:inline-block;width:${size}px;height:${size}px;flex:none"></i>`;
}
function hydrateIcons(root){
  if(window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons({root: root || document});
}

/* ================= 日期工具 ================= */
const DAY = 864e5;
const today = new Date(); today.setHours(0,0,0,0);
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a,b)=>Math.round((a-b)/DAY);
const iso = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const md = d=>`${d.getMonth()+1}/${d.getDate()}`;
const parseISO = s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 下一個 5/1：今天在 5/1 之前是今年，當天或之後是明年（P2-1 決定，原本寫死明年）
const nextMay = `${today < new Date(today.getFullYear(),4,1) ? today.getFullYear() : today.getFullYear()+1}-05-01`;

/* ================= 假資料 ================= */
const LOCS = [
  {id:'lr', name:'客廳', icon:'sofa'},
  {id:'dn', name:'餐廳', icon:'utensils'},
  {id:'kt', name:'廚房', icon:'cooking-pot'},
  {id:'mb', name:'主臥', icon:'bed-double'},
  {id:'sb', name:'次臥', icon:'bed-single'},
  {id:'kd', name:'小孩房', icon:'toy-brick'},
  {id:'st', name:'書房', icon:'book-open'},
  {id:'ba', name:'浴室', icon:'bath'},
  {id:'bc', name:'陽台', icon:'sun'},
];
const CATS = [
  {id:'ac', name:'冷氣濾網', icon:'air-vent'},
  {id:'ft', name:'濾心', icon:'droplets'},
  {id:'dh', name:'防潮盒', icon:'package'},
  {id:'ap', name:'空清濾網', icon:'wind'},
  {id:'dm', name:'除濕機濾網', icon:'fan'},
  {id:'hd', name:'抽油煙機濾網', icon:'flame'},
  {id:'wm', name:'洗衣機濾網', icon:'washing-machine'},
];
/* 精選 icon 清單（規格草稿 #11）。名稱已對 lucide@1.44.0 逐一核對；
   filter、waves 是別名，這裡用實際名稱 funnel、waves-horizontal。 */
const ROOM_ICONS = ['sofa','armchair','tv','lamp-floor','utensils','cooking-pot','chef-hat','refrigerator',
  'bed-double','bed-single','baby','toy-brick','book-open','laptop','briefcase','bath','shower-head','toilet',
  'washing-machine','shirt','sun','flower-2','sprout','car','warehouse','door-open','house','dumbbell','gamepad-2','cat'];
const CAT_ICONS = ['air-vent','fan','wind','snowflake','sun-snow','thermometer','heater','droplet','droplets',
  'glass-water','funnel','package','box','archive','flame','washing-machine','shower-head','battery','lightbulb',
  'plug','zap','spray-can','sparkles','brush','trash','recycle','leaf','shield','waves-horizontal','coffee'];
const loc = id=>LOCS.find(l=>l.id===id);
const cat = id=>CATS.find(c=>c.id===id);

/* 每筆更換紀錄帶自己的週期、品牌、型號（規格草稿 #3 #4）。logs 由新到舊。
   left = 想呈現的剩餘天數，用來反推最近一次更換日，讓到期日永遠是算出來的 */
function mk(id, locId, catId, o){
  const first = o.unknown
    ? {on:null, expectedDue:addDays(today,o.left), cycleDays:o.cycle, brand:o.brand||'', model:o.model||'', photos:0, purchase:null}
    : {on:addDays(today,o.left-o.cycle), cycleDays:o.cycle, brand:o.brand||'', model:o.model||'', photos:o.lastPhotos||0, purchase:o.lastPurchase||null, note:o.lastNote||''};
  const logs = [first];
  let cur = first.on;
  (o.history||[]).forEach(h=>{
    cur = addDays(cur,-h.gap);
    logs.push({on:cur, cycleDays:h.cycle, brand:h.brand, model:h.model, photos:h.photos||0, purchase:h.purchase||null, note:h.note||''});
  });
  return {id, loc:locId, cat:catId, label:o.label||'', leadDays:o.lead??7, note:o.note||'',
    photos:o.photos||0, paused:!!o.paused, pausedUntil:o.pausedUntil||null, logs};
}
const ITEMS = [
  mk('lr-ac','lr','ac',{cycle:90,left:-12,brand:'3M',model:'淨呼吸 9808',photos:2,lastPhotos:1,
    note:'機身型號 RAS-50NJ，濾網在上蓋掀開處',
    history:[
      {gap:112,cycle:90,brand:'3M',model:'淨呼吸 9808',photos:1,purchase:{unitPrice:400, qty:1, unit:'捲'},
        note:'好市多買的，一捲剪五片'},
      {gap:130,cycle:90,brand:'',model:'',purchase:{unitPrice:150, qty:1, unit:'片'},
        note:'3M 缺貨，先用五金行的白牌\n濾網比較薄，三個月就黑了'},
      {gap:112,cycle:90,brand:'3M',model:'淨呼吸 9808',photos:1,purchase:{unitPrice:380, qty:1, unit:'捲'}},
    ]}),
  mk('lr-ap','lr','ap',{cycle:180,left:41,lead:14,brand:'Blueair',model:'205 替換濾網'}),
  mk('dn-ac','dn','ac',{cycle:180,left:120,brand:'3M',model:'淨呼吸 9808',note:'餐廳冷氣很少開',
    history:[{gap:176,cycle:180,brand:'3M',model:'淨呼吸 9808'}]}),
  mk('kt-sink','kt','ft',{label:'水槽',cycle:180,left:-3,lead:14,brand:'3M',model:'SQC 快拆式'}),
  mk('kt-pp','kt','ft',{label:'淨水器 PP',cycle:90,left:23,lead:14}),
  mk('kt-hd','kt','hd',{cycle:60,left:19}),
  mk('mb-ac','mb','ac',{cycle:60,left:38,brand:'3M',model:'淨呼吸 9808',note:'主臥冷氣天天開',
    history:[
      {gap:58,cycle:60,brand:'3M',model:'淨呼吸 9808'},
      {gap:63,cycle:90,brand:'3M',model:'淨呼吸 9808'},
    ]}),
  // P3：剩餘天數改成剛好等於提前提醒天數，讓「今天進入即將到期」的通知示意有東西可以列（P0 是 5）
  mk('mb-dh','mb','dh',{label:'衣櫥',cycle:90,left:7,brand:'克潮靈',model:'除濕盒'}),
  mk('mb-dm','mb','dm',{cycle:365,left:88,brand:'Panasonic',model:'F-Y22EN 濾網'}),
  mk('sb-ac','sb','ac',{cycle:90,left:40,brand:'3M',model:'淨呼吸 9808',paused:true,pausedUntil:nextMay}),
  mk('kd-ac','kd','ac',{cycle:90,left:52,brand:'3M',model:'淨呼吸 9808',paused:true,pausedUntil:nextMay}),
  mk('st-ac','st','ac',{cycle:90,left:33,paused:true,pausedUntil:nextMay}),
  mk('ba-ft','ba','ft',{label:'蓮蓬頭',unknown:true,cycle:180,left:102}),
  mk('bc-wm','bc','wm',{cycle:30,left:12}),
];
// 每筆紀錄的建立順序（seq 越大越晚建立），用在同一天有多筆時決定先後（規格草稿 #14）
ITEMS.forEach(it=>it.logs.forEach((l,k)=>{ l.seq = it.logs.length - k; }));
const find = id=>ITEMS.find(i=>i.id===id);
// 依日期由新到舊；日期未記錄的排最後；同一天較晚建立的在前
const sortLogs = (a,b)=>((b.on?b.on.getTime():-1e15) - (a.on?a.on.getTime():-1e15)) || ((b.seq||0) - (a.seq||0));
const nextSeq = it=>Math.max(0, ...it.logs.map(x=>x.seq||0)) + 1;
/* 修改後的結果說明（規格草稿 #14）：最近一次換了哪一筆、到期日變成哪天。沒有變化就回空字串 */
function outcomeText(it, before, self){
  const now = it.logs[0], due = calcDue(it), parts = [];
  if(before.latest !== now) parts.push(now===self ? '這筆現在是最近一次' : `${now.on?iso(now.on):'日期未記錄'} 那筆現在是最近一次`);
  if(iso(before.due) !== iso(due)) parts.push(`到期日改為 ${md(due)}`);
  return parts.join('，');
}
const purchaseText = pu=>pu ? `${pu.unitPrice} 元／${pu.unit||'個'}${pu.qty>1?` × ${pu.qty}`:''}` : '';

/* ================= 到期與狀態 =================
   due = 最近一筆紀錄的日期 + 該筆紀錄的週期；日期未記錄時用預計到期日 */
function calcDue(it){ const l=it.logs[0]; return l.on ? addDays(l.on,l.cycleDays) : l.expectedDue; }
function leftOf(it){ return diffDays(calcDue(it), today); }
function calcStatus(it){
  if(it.paused) return 'paused';
  const left = leftOf(it);
  if(left < 0) return 'overdue';
  if(left <= it.leadDays) return 'soon';
  return 'ok';
}
const fullName = it=>[loc(it.loc).name, cat(it.cat).name, it.label].filter(Boolean).join(' · ');
const brandModel = lg=>[lg.brand,lg.model].filter(Boolean).join(' ');
/* 沒填品牌型號時留空（規格草稿 #3）；列表第二行連前面的「·」一起拿掉，只剩週期 */
const bmLine = lg=>{ const t = brandModel(lg); return t ? `${esc(t)} · ${lg.cycleDays} 天` : `${lg.cycleDays} 天`; };
/* 型號變更判斷前先整理字串，避免 3M／3m、全半形、多餘空白被誤判 */
const norm = t=>t.normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase();
function daysText(it){
  if(it.paused) return `暫停至 ${md(parseISO(it.pausedUntil))}`;
  const l = leftOf(it);
  return l<0 ? `逾期 ${-l} 天` : l===0 ? '今天到期' : `還有 ${l} 天`;
}
function shortDays(it){
  if(it.paused) return '暫停';
  const l = leftOf(it);
  return l<0 ? `逾期 ${-l} 天` : `${l} 天`;
}
const STRIPE = {overdue:'var(--overdue)', soon:'var(--soon)', ok:'var(--line)', paused:'var(--paused)'};
const STTEXT = {overdue:'var(--overdue)', soon:'var(--soon)', ok:'var(--ink-2)', paused:'var(--paused)'};
const STLABEL = {overdue:'逾期', soon:'即將到期', ok:'正常', paused:'暫停中'};
const BADGE = {overdue:'bg-overdue-soft text-overdue', soon:'bg-soon-soft text-soon', ok:'bg-line-2 text-ink-2', paused:'bg-line-2 text-paused'};

/* ================= 狀態 ================= */
const settings = {defaultLead:7};
// showPrice 固定為 true：使用者決定保留價格記錄（規格草稿 #13），原型選單的開關已拿掉
const view = {screen:'home', back:'home', detailId:'lr-ac', itemIcons:true, showPrice:true, homeFilter:null, theme:'system'};
const PRE = [30,60,90,180,365];
/* P3 狀態，原型選單可以切換。lastExport：幾天前匯出過，null 表示從來沒匯出 */
const P3 = {notif:true, exact:true, remindTime:'09:00', lastExport:3, asked:false};
let F = freshForm();
function freshForm(){
  return {loc:'mb', cat:'ac', brand:'', model:'', label:'', labelOpen:false,
    last:'today', lastDate:iso(today), nextDue:iso(addDays(today,60)),
    cycle:'', custom:false, lead:String(settings.defaultLead), note:'', photo:false, recog:false,
    costOpen:false, price:'', qty:'1', unit:'', err:'', itemPhotos:0};
}
const $ = id=>document.getElementById(id);

/* ================= 共用樣式片段 ================= */
const LBL = 'mb-1.5 block text-[13px] font-medium text-ink-2';
const INP = 'w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-[15px] text-ink placeholder:text-ink-3 focus:border-accent focus:outline-none';
const chip = (on, mono)=>`nowrap rounded-[10px] border px-3.5 py-2 text-[14px] ${mono?'font-mono tabular-nums':''} ${on?'border-ink bg-ink text-ground':'border-line bg-surface text-ink'}`;
const sectDiv = t=>`<div class="mb-2.5 mt-6 flex items-center gap-2.5"><h2 class="nowrap text-[13px] font-semibold tracking-wide text-ink-2">${t}</h2><span class="h-px flex-1 bg-line"></span></div>`;
const kv = (k,v,hint)=>`<div class="flex justify-between gap-4 border-t border-line-2 py-2.5 first:border-t-0">
  <span class="nowrap shrink-0 text-[13.5px] text-ink-3">${k}</span>
  <span class="text-right text-[14px]">${v}${hint?`<span class="block font-mono text-[11.5px] text-ink-3">${hint}</span>`:''}</span></div>`;
const tile = name=>`<span class="grid h-9 w-9 shrink-0 place-items-center rounded-[10px] bg-line-2 text-ink-2">${ic(name,19)}</span>`;

/* ================= 首頁：依位置分組 ================= */
function homeRow(it, i){
  const st = calcStatus(it), lg = it.logs[0], urgent = st==='overdue' || st==='soon';
  return `<div class="flex items-center gap-3 px-3 py-3 ${i?'border-t border-line-2':''}">
    <span class="w-[3px] self-stretch rounded-full" style="background:${STRIPE[st]}"></span>
    ${view.itemIcons ? tile(cat(it.cat).icon) : ''}
    <button data-open="${it.id}" class="min-w-0 flex-1 text-left">
      <span class="block text-[15.5px] font-medium leading-snug">${esc(cat(it.cat).name)}${it.label?`<span class="font-normal text-ink-3"> · ${esc(it.label)}</span>`:''}</span>
      <span class="mt-0.5 block truncate text-[12.5px] text-ink-3">${bmLine(lg)}</span>
      <span class="nowrap mt-1 block font-mono text-[14.5px] font-medium tabular-nums" style="color:${STTEXT[st]}">${daysText(it)}</span>
    </button>
    <button data-done="${it.id}" class="nowrap shrink-0 self-center rounded-[10px] px-3.5 py-2.5 text-[14px] font-medium ${urgent?'bg-accent text-accent-ink':'bg-accent-soft text-accent'}">換好了</button>
  </div>`;
}
function statTile(n, label, st){
  const bg = {overdue:'bg-overdue-soft', soon:'bg-soon-soft', ok:'bg-line-2'}[st];
  const col = {overdue:'text-overdue', soon:'text-soon', ok:'text-ink-2'}[st];
  const active = view.homeFilter===st, dim = view.homeFilter && !active;
  // 數量 0 的方塊不能點；篩選中被選的加框線，其他變淡
  return `<button data-hfilter="${st}" ${n?'':'disabled'} aria-pressed="${active}"

function renderHome(){
  const act = ITEMS.filter(i=>!i.paused), paused = ITEMS.filter(i=>i.paused);
  const count = s=>act.filter(i=>calcStatus(i)===s).length;
  // 篩選中的狀態數量歸零（例如剛把最後一個逾期的換好）就自動取消篩選
  if(view.homeFilter && count(view.homeFilter)===0) view.homeFilter = null;
  const shown = view.homeFilter ? act.filter(i=>calcStatus(i)===view.homeFilter) : act;
  let groups = LOCS.map(l=>({l, items:shown.filter(i=>i.loc===l.id).sort((a,b)=>leftOf(a)-leftOf(b))}))

  // 固定順序；有逾期物品的位置暫時置頂（規格草稿 #8，看完原型再確認）
  const hot = g=>g.items.some(i=>calcStatus(i)==='overdue');
  groups = [...groups.filter(hot), ...groups.filter(g=>!hot(g))];

  let h = notifBanner() + `<div class="grid grid-cols-3 gap-2 pt-4">

        <span class="font-mono text-[12.5px] text-ink-3">${g.items.length}</span>
        ${hot(g)?`<span class="nowrap rounded-md bg-overdue-soft px-1.5 py-0.5 text-[11px] font-medium text-overdue">有逾期</span>`:''}

    <span class="text-paused">${ic('pause',17)}</span>

    <b class="text-ink-2">這是 P3 原型。</b>以 P0 原型為底，P3 新增：通知示意、通知關閉時首頁的提示、設定的「提醒」與「資料」區塊。從右上角「原型」切換狀態、看通知示意。資料是假的、不會存。</p>`;
  return h;
}

/* ================= P3：通知 ================= */
/* 通知被關掉時首頁最上方常駐提示（P3 決定 4a）：通知關了，app 就不會再提醒，跟暫停一樣是靜默失效 */
function notifBanner(){
  if(P3.notif) return '';
  return `<div class="mt-4 flex items-center gap-3 rounded-xl bg-overdue-soft px-3.5 py-3 text-overdue">
    ${ic('bell-off',19)}
    <span class="min-w-0 flex-1 leading-snug"><b class="block text-[14px] font-semibold">通知已關閉</b><span class="block text-[12.5px]">物品到期時不會提醒你</span></span>
    <button data-notif-open class="nowrap shrink-0 rounded-[10px] bg-overdue px-3.5 py-2 text-[14px] font-medium text-surface">開啟</button>
  </div>`;
}
/* 今天要提醒哪些物品（P3 決定 2a）：進入即將到期的第一天、到期當天、逾期後每天 */
function remindToday(){
  return ITEMS.filter(it=>{
    if(it.paused) return false;
    const l = leftOf(it);
    return l < 0 || l === 0 || l === it.leadDays;
  }).sort((a,b)=>leftOf(a)-leftOf(b));
}
const lastOnText = lg=>lg.on ? `上次 ${md(lg.on)} 換的` : '上次更換日未記錄';
/* 通知內容。單項點進該物品、多項點進首頁（P3 決定 1a） */
function notifContent(kind){
  if(kind==='soon'){
    const it = find('mb-dh');
    return {title:`${fullName(it)} 快到期了`, body:`還有 ${leftOf(it)} 天，${lastOnText(it.logs[0])}`, target:it.id};
  }
  if(kind==='due'){
    // 假設今天只有這一項，而且剛好到期：上次更換日用今天往回推一個週期
    const it = find('bc-wm'), lg = it.logs[0];
    return {title:`${fullName(it)} 今天到期`, body:`上次 ${md(addDays(today,-lg.cycleDays))} 換的，週期 ${lg.cycleDays} 天`, target:it.id};
  }
  if(kind==='over'){
    const it = find('lr-ac'), lg = it.logs[0];
    return {title:`${fullName(it)} 已逾期 ${-leftOf(it)} 天`, body:`${lastOnText(lg)}，週期 ${lg.cycleDays} 天`, target:it.id};
  }
  if(kind==='stale'){
    return {title:'很久沒打開換了沒', body:'打開一次，才會繼續排之後的提醒', target:null};
  }
  const list = remindToday();
  const tag = it=>{ const l = leftOf(it); return l<0 ? `逾期 ${-l} 天` : l===0 ? '今天到期' : `還有 ${l} 天`; };
  return {title:`今天有 ${list.length} 項該換`, body:list.map(fullName).join('、'),
    lines:list.map(it=>({name:fullName(it), tag:tag(it), st:calcStatus(it)})), target:null};
}
function openNotifMock(kind){
  const n = notifContent(kind);
  let expanded = false;
  const wrap = document.createElement('div');

    wrap.innerHTML = `<div class="anim-up w-full max-w-[430px] px-3 pt-3">
      <p class="mb-2 text-center font-mono text-[11px] text-white opacity-80">通知示意 · 實際樣式依手機系統</p>

        </span>

          : `<span class="mt-0.5 block truncate text-[14px] text-ink-2">${esc(n.body)}</span>`}
      </button>
      <p class="mt-3 text-center text-[12.5px] leading-relaxed text-white opacity-90">${n.target ? '點通知進入這個物品' : n.lines ? '點通知回到首頁；點右上角箭頭展開清單' : '點通知打開 app'}</p>
      <button data-n-close class="mx-auto mt-2 block rounded-full bg-surface px-4 py-2 text-[13px] text-ink-2">關閉示意</button>
    </div>`;
    hydrateIcons(wrap);
  };
  draw();

    const t = e.target;
    if(t===wrap || t.closest('[data-n-close]')) return close();
    if(t.closest('[data-n-expand]')){ expanded = !expanded; return draw(); }

  });
}
/* 要求通知權限前的說明，新增第一個物品後出現（P3 決定）。

function openNotifAsk(){
  const {scrim, body, close} = makeSheet();

function openRemindTime(){
  let v = P3.remindTime;
  const {scrim, body, close} = makeSheet();
  const draw = ()=>{
    body.innerHTML = `
    <h3 class="text-[18px] font-semibold">提醒時間</h3>
    <p class="mt-1.5 text-[13.5px] leading-relaxed text-ink-3">每天在這個時間通知一次，當天該換的物品合成一則。</p>
    <div class="mt-4 flex flex-wrap gap-2">${['07:00','08:00','09:00','12:00','20:00'].map(x=>`<button data-tv="${x}" class="${chip(v===x, true)}">${x}</button>`).join('')}</div>
    <input type="time" data-k="t" value="${esc(v)}" class="${INP} mt-3 w-36 font-mono">
    <button data-save class="mt-5 w-full rounded-xl bg-accent py-3.5 text-[15.5px] font-semibold text-accent-ink">儲存</button>
    <button data-close class="mt-2 w-full py-3 text-[14px] text-ink-3">取消</button>`;
  };
  draw();
  scrim.addEventListener('input', e=>{ if(e.target.dataset.k==='t') v = e.target.value; });
  scrim.addEventListener('click', e=>{
    const t = e.target;
    if(t===scrim || t.closest('[data-close]')) return close();
    const tv = t.closest('[data-tv]'); if(tv){ v = tv.dataset.tv; return draw(); }
    if(t.closest('[data-save]') && v){
      const prev = P3.remindTime;
      P3.remindTime = v;
      close(); render();
      showToast(`提醒時間改為 ${v}`, ()=>{ P3.remindTime = prev; });
    }
  });
}

/* ================= 詳情 ================= */
function renderDetail(){
  const it = find(view.detailId), st = calcStatus(it), lg = it.logs[0], due = calcDue(it), l = leftOf(it);
  const dated = it.logs.filter(x=>x.on);
  const gaps = [];
  for(let k=0; k<dated.length-1; k++) gaps.push(diffDays(dated[k].on, dated[k+1].on));
  const avg = gaps.length>=2 ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : null;
  const suggest = avg ? Math.round(avg/10)*10 : null;

  let h = `<div class="mt-4 flex items-center gap-4 rounded-2xl bg-surface p-4 shadow-card">
    <div class="min-w-[76px]">
      <div class="font-mono text-[34px] font-medium leading-none tabular-nums" style="color:${st==='ok'?'var(--ink)':STTEXT[st]}">${it.paused?'—':Math.abs(l)}</div>
      <div class="nowrap mt-1.5 font-mono text-[12px] text-ink-3">${it.paused?'已暫停':l<0?'天前該換':l===0?'今天到期':'天後到期'}</div>
    </div>
    <div class="flex-1 text-right">
      <span class="nowrap rounded-md px-2 py-0.5 font-mono text-[11.5px] ${BADGE[st]}">${STLABEL[st]}</span>
      <div class="mt-2 font-mono text-[12.5px] leading-relaxed text-ink-3">
        ${iso(due)} 到期<br>${lg.on?`上次更換 ${iso(lg.on)}`:'上次更換日期未記錄'}

    ${kv('目前週期', `${lg.cycleDays} 天`, '取自最近一次更換')}
    ${kv('提前提醒', `${it.leadDays} 天`)}
    ${kv('位置', esc(loc(it.loc).name))}

function renderAdd(){

function submitAdd(){
  const cyc = parseInt(F.cycle,10);
  if(!(cyc>0)){
    F.err = 'cycle'; render();
    const el = document.querySelector('[data-fcyc]'); if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  const base = {seq:1, cycleDays:cyc, brand:F.brand.trim(), model:F.model.trim(), photos:F.photo?1:0,
    purchase:(view.showPrice && F.price) ? {unitPrice:+F.price, qty:+F.qty||1, unit:F.unit||'個'} : null};
  const first = F.last==='unknown'
    ? {...base, on:null, expectedDue:parseISO(F.nextDue)}
    : {...base, on: F.last==='today' ? new Date(today) : parseISO(F.lastDate)};
  const it = {id:'n'+Date.now(), loc:F.loc, cat:F.cat, label:F.label.trim(), leadDays:parseInt(F.lead,10)||7,
    note:F.note, photos:F.itemPhotos, paused:false, pausedUntil:null, logs:[first]};
  ITEMS.push(it);
  F = freshForm();
  go('home');
  showToast(`已新增 ${fullName(it)}`, ()=>{ const k=ITEMS.indexOf(it); if(k>=0) ITEMS.splice(k,1); });
  // P3：新增第一個物品後才問通知權限（P3 決定），這時看得出通知的用途。原型已有假資料，用「這次開啟後第一次新增」代替
  if(!P3.asked){ P3.asked = true; openNotifAsk(); }
}

/* ================= Sheet 與 Toast ================= */
function makeSheet(){
  const scrim = document.createElement('div');
  scrim.dataset.sheet = '1';
  scrim.className = 'fixed inset-0 z-40 flex items-end justify-center';
  scrim.style.background = 'var(--scrim)';
  // Sheet 內的點擊不往外傳到 document。
  // 原因：sheet 的 draw() 會整塊重寫內容，被點的元素在 document 層收到事件時已經脫離 DOM，
  // 全域 handler 的 closest('[data-sheet]') 找不到 scrim，會把同一個點擊再處理一次
  // （v3 的 bug：原型選單的花費開關被切兩次，看起來開了、實際仍是關）。
  // 這個 listener 必須比各 sheet 自己的 click listener 先註冊；同一元素上的其他 listener 仍會執行。
  scrim.addEventListener('click', e=>e.stopPropagation());
  const body = document.createElement('div');
  body.className = 'anim-up max-h-[90dvh] w-full max-w-[430px] overflow-y-auto rounded-t-[20px] bg-surface px-[18px] pt-5';
  body.style.paddingBottom = 'calc(22px + env(safe-area-inset-bottom))';
  scrim.appendChild(body);
  document.body.appendChild(scrim);
  const mo = new MutationObserver(()=>{
    mo.disconnect();
    hydrateIcons(body);
    mo.observe(body, {childList:true, subtree:true});
  });
  mo.observe(body, {childList:true, subtree:true});
  return {scrim, body, close:()=>{ mo.disconnect(); scrim.remove(); }};
}
let toastTimer = null;
function showToast(msg, undo){
  clearTimeout(toastTimer);
  const old = $('toast'); if(old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast';
  // 不用 transform 置中，避免跟進場動畫的 transform 互相覆蓋
  t.className = 'anim-up fixed inset-x-0 z-50 mx-auto flex w-[calc(100%-32px)] max-w-[398px] items-center gap-3 rounded-xl bg-ink px-4 py-3 text-[14px] text-ground shadow-lg';
  t.style.bottom = 'calc(92px + env(safe-area-inset-bottom))';
  t.innerHTML = `<span class="min-w-0 flex-1">${esc(msg)}</span>${undo?'<button class="nowrap font-semibold underline underline-offset-4">復原</button>':''}`;
  document.body.appendChild(t);
  if(undo) t.querySelector('button').onclick = ()=>{ undo(); t.remove(); render(); };
  toastTimer = setTimeout(()=>t.remove(), 5200);
}

      <textarea data-k="note" rows="2" placeholder="選填，例如購買通路、這次的狀況…" class="${INP} leading-relaxed">${esc(s.note)}</textarea>
    </div>

    ${view.showPrice?`
    <button data-bought class="mt-4 flex w-full items-center gap-2.5 rounded-xl border border-line px-3.5 py-3 text-left text-[14px]">
      <span class="grid h-5 w-5 shrink-0 place-items-center rounded-md border ${s.bought?'border-accent bg-accent text-accent-ink':'border-line'}">${s.bought?ic('check',14,2.5):''}</span>
      這次有買新的
    </button>
    ${s.bought?`<div class="mt-2 grid grid-cols-[1fr_68px_76px] gap-2">
      <input data-k="price" type="number" inputmode="numeric" value="${esc(s.price)}" placeholder="單價（元）" class="${INP}">
      <input data-k="qty" type="number" inputmode="numeric" value="${esc(s.qty)}" class="${INP}">
      <input data-k="unit" value="${esc(s.unit)}" placeholder="單位" class="${INP}">
    </div>`:''}`:''}

    ${s.err?'<p class="mt-3 text-[13px] text-overdue">請填週期天數</p>':''}
    <button data-confirm class="mt-5 w-full rounded-xl bg-accent py-3.5 text-[15.5px] font-semibold text-accent-ink">確認</button>`;
  };
  draw();

  scrim.addEventListener('input', e=>{
    const k = e.target.dataset.k; if(!k) return;
    s[k] = e.target.value;
    if(k==='brand' || k==='model'){
      s.recog = false;
      const hint = body.querySelector('#bmHint');
      if(hint){ hint.textContent = bmHint(); hint.style.color = bmColor(); }
    }
  });
  scrim.addEventListener('click', e=>{
    const t = e.target;
    if(t===scrim || t.closest('[data-close]')) return close();
    const d = t.closest('[data-date]'); if(d){ s.date = d.dataset.date; return draw(); }
    const c = t.closest('[data-cyc]');
    if(c){ if(c.dataset.cyc==='custom') s.custom = true; else { s.custom = false; s.cycle = c.dataset.cyc; } s.err=false; return draw(); }
    if(t.closest('[data-shoot]')){ s.photo = true; s.recog = true; s.brand = '3M'; s.model = '淨呼吸 9808'; return draw(); }
    if(t.closest('[data-bought]')){ s.bought = !s.bought; return draw(); }
    if(t.closest('[data-confirm]')){
      const cyc = parseInt(s.cycle,10);
      if(!(cyc>0)){ s.err = true; return draw(); }
      const prev = {logs:it.logs.slice(), paused:it.paused, pausedUntil:it.pausedUntil};
      const newLog = {
        on: s.date==='today' ? new Date(today) : parseISO(s.dateVal),
        cycleDays:cyc, brand:s.brand.trim(), model:s.model.trim(), photos:s.photo?1:0, note:s.note.trim(),
        purchase:(view.showPrice && s.bought && s.price) ? {unitPrice:+s.price, qty:+s.qty||1, unit:s.unit||'個'} : null,
        seq: nextSeq(it),
      };
      it.logs = [newLog, ...it.logs].sort(sortLogs);
      it.paused = false; it.pausedUntil = null;
      close(); render();
      showToast(it.logs[0]===newLog ? `${fullName(it)} 已記錄` : '已記錄 · 日期早於上次更換，到期日沒有變',
        ()=>Object.assign(it, prev));
    }
  });
}

/* ---------- 暫停 ---------- */
function openPause(id){
  const it = find(id);
  if(it.paused){
    const prev = {paused:true, pausedUntil:it.pausedUntil};
    it.paused = false; it.pausedUntil = null;
    render(); showToast(`${fullName(it)} 已恢復`, ()=>Object.assign(it, prev));
    return;
  }
  let pick = null, custom = iso(addDays(today,120));
  const opts = [
    {k:'3m', t:'3 個月後', d:iso(addDays(today,90))},
    {k:'may', t:'5 月 1 日', d:nextMay},
    {k:'pick', t:'指定日期', d:null},
  ];
  const {scrim, body, close} = makeSheet();
  const draw = ()=>{
    body.innerHTML = `
    <h3 class="text-[18px] font-semibold">暫停「${esc(fullName(it))}」</h3>
    <p class="mt-1.5 text-[13.5px] leading-relaxed text-ink-3">暫停期間不計到期、不提醒。<b class="text-ink-2">預計恢復日必填</b>——忘了恢復的話，這個 app 會永遠不再提醒你，而且不會有任何異狀。</p>
    <div class="mt-4 flex flex-col gap-2">
      ${opts.map(o=>`<button data-p="${o.k}" class="flex w-full items-center justify-between rounded-xl border px-3.5 py-3 text-left text-[14.5px] ${pick===o.k?'border-accent bg-accent-soft text-accent':'border-line'}">
        <span>${o.t}</span><span class="nowrap font-mono text-[12px] text-ink-3">${o.d||'自己選'}</span></button>`).join('')}
    </div>
    ${pick==='pick'?`<input type="date" data-k="custom" value="${custom}" min="${iso(addDays(today,1))}" class="${INP} mt-2">`:''}
    ${pick?'':'<p class="mt-3 text-[12.5px] text-overdue">請先選一個恢復時間</p>'}
    <button data-confirm ${pick?'':'disabled'} class="mt-4 w-full rounded-xl bg-accent py-3.5 text-[15px] font-semibold text-accent-ink disabled:opacity-40">確定暫停</button>
    <button data-close class="mt-2 w-full py-3 text-[14px] text-ink-3">取消</button>`;
  };
  draw();
  scrim.addEventListener('input', e=>{ if(e.target.dataset.k==='custom') custom = e.target.value; });
  scrim.addEventListener('click', e=>{
    const t = e.target;
    if(t===scrim || t.closest('[data-close]')) return close();
    const p = t.closest('[data-p]'); if(p){ pick = p.dataset.p; return draw(); }
    if(t.closest('[data-confirm]') && pick){
      const prev = {paused:false, pausedUntil:null};
      it.paused = true;
      it.pausedUntil = pick==='3m' ? opts[0].d : pick==='may' ? nextMay : custom;
      close(); render(); showToast(`${fullName(it)} 已暫停`, ()=>Object.assign(it, prev));
    }
  });
}

    </div>
    ${sectDiv('P3：狀態')}
    <div class="flex flex-col gap-2.5">
      ${p3Seg('通知', 'notif', [[true,'已開啟'],[false,'已關閉']])}
      ${p3Seg('準時提醒', 'exact', [[true,'已允許'],[false,'未允許']])}
      ${p3Seg('上次匯出', 'lastExport', [[3,'3 天前'],[45,'45 天前'],[null,'從未']])}
    </div>

/* ---------- 位置／類別：編輯名稱與 icon ---------- */
function openEditPlace(kind, id){
  const isLoc = kind==='loc';
  const list = isLoc ? LOCS : CATS;
  const icons = isLoc ? ROOM_ICONS : CAT_ICONS;
  const word = isLoc ? '位置' : '類別';
  const target = id ? list.find(x=>x.id===id) : null;
  const used = target ? ITEMS.filter(i=>i[kind]===target.id).length : 0;
  const form = {name: target ? target.name : '', icon: target ? target.icon : icons[0], err:''};
  const {scrim, body, close} = makeSheet();
  const draw = ()=>{
    body.innerHTML = `
    <div class="flex items-center justify-between">
      <h3 class="text-[18px] font-semibold">${target?'編輯':'新增'}${word}</h3>
      <button data-close class="-mr-1.5 grid h-9 w-9 place-items-center rounded-lg text-ink-3" aria-label="關閉">${ic('x',20)}</button>
    </div>
    <div class="mt-4 flex items-end gap-3">
      <span class="grid h-[46px] w-[46px] shrink-0 place-items-center rounded-xl bg-accent-soft text-accent">${ic(form.icon,24)}</span>
      <div class="min-w-0 flex-1"><label class="${LBL}">名稱</label>
        <input data-k="name" value="${esc(form.name)}" placeholder="${isLoc?'例如 主臥':'例如 冷氣濾網'}" class="${INP}"></div>
    </div>
    ${form.err?`<p class="mt-1.5 text-[12.5px] text-overdue">${esc(form.err)}</p>`:''}
    <label class="${LBL} mt-4">icon</label>
    <div class="grid grid-cols-6 gap-1.5">
      ${icons.map(n=>`<button data-icon="${n}" aria-label="${n}" aria-pressed="${form.icon===n}" class="grid aspect-square place-items-center rounded-xl border ${form.icon===n?'border-accent bg-accent-soft text-accent':'border-line-2 text-ink-2'}">${ic(n,22)}</button>`).join('')}
    </div>
    <button data-save class="mt-5 w-full rounded-xl bg-accent py-3.5 text-[15.5px] font-semibold text-accent-ink">${target?'儲存':'新增'}</button>
    ${target?`<button data-del ${used?'disabled':''} class="mt-2 w-full rounded-xl py-3 text-[14px] text-overdue disabled:text-ink-3">刪除${word}</button>
      ${used?`<p class="text-center text-[12px] leading-relaxed text-ink-3">還有 ${used} 個物品在這個${word}，要先移到別的${word}才能刪除</p>`:''}`:''}`;
  };
  draw();
  scrim.addEventListener('input', e=>{ if(e.target.dataset.k==='name') form.name = e.target.value; });
  scrim.addEventListener('click', e=>{
    const t = e.target;
    if(t===scrim || t.closest('[data-close]')) return close();
    const b = t.closest('[data-icon]'); if(b){ form.icon = b.dataset.icon; form.err=''; return draw(); }
    if(t.closest('[data-save]')){
      const name = form.name.trim();
      if(!name){ form.err = `請填${word}名稱`; return draw(); }
      if(list.some(x=>x.name===name && x!==target)){ form.err = `已經有「${name}」了`; return draw(); }
      if(target){
        const prev = {name:target.name, icon:target.icon};
        target.name = name; target.icon = form.icon;
        close(); render(); showToast(`已更新${word}「${name}」`, ()=>Object.assign(target, prev));
      } else {
        const obj = {id:(isLoc?'l':'c')+Date.now(), name, icon:form.icon};
        list.push(obj);
        close(); render(); showToast(`已新增${word}「${name}」`, ()=>{ const k=list.indexOf(obj); if(k>=0) list.splice(k,1); });
      }
      return;
    }
    if(t.closest('[data-del]') && target && !used){
      const k = list.indexOf(target);
      list.splice(k,1);
      close(); render(); showToast(`已刪除${word}「${target.name}」`, ()=>list.splice(k,0,target));
    }
  });
}

        ${s.photos<2?`<button data-lphoto class="grid h-14 w-14 place-items-center rounded-xl border border-dashed border-line text-ink-3">${ic('camera',18)}</button>`:''}

      it.logs.sort(sortLogs);
      close(); render();

    if(t.closest('[data-ldel]') && !only){

      const before = {latest:it.logs[0], due:calcDue(it)};
      it.logs.splice(idx, 1);
      close(); render();
      const out = outcomeText(it, before, null);
      showToast(out ? `已刪除 · ${out}` : '已刪除更換紀錄', ()=>{ it.logs = prevLogs; });
    }
  });
}

/* ================= 繪製與導航 ================= */
function setTheme(k){
  view.theme = k;
  const r = document.documentElement;
  if(k==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', k);
}
const TITLES = {home:'換了沒', items:'物品', settings:'設定', add:'新增物品'};
function render(){
  const s = view.screen;
  $('main').innerHTML =
    s==='home' ? renderHome() :
    s==='items' ? renderItems() :
    s==='detail' ? renderDetail() :
    s==='add' ? renderAdd() :
    s==='edit' ? renderEdit() : renderSettings();
  hydrateIcons($('main'));
  $('title').textContent = s==='detail' ? fullName(find(view.detailId)) : s==='edit' ? '編輯物品' : TITLES[s];
  $('back').hidden = !(s==='detail' || s==='add' || s==='edit');
  $('fab').hidden = !(s==='home' || s==='items');
  document.querySelectorAll('#tabs button').forEach(b=>{
    const on = b.dataset.tab===s || ((s==='detail' || s==='edit') && b.dataset.tab===view.back);
    b.style.color = on ? 'var(--accent)' : 'var(--ink-3)';
    b.style.fontWeight = on ? '500' : '400';
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
}
function go(screen, id){
  // 離開首頁就清除篩選（規格草稿 #8）：停在「正常」時，逾期的東西會被藏起來
  if(screen!=='home') view.homeFilter = null;
  if(screen!=='settings') view.reorderLocs = false;
  // 從分頁（首頁／物品／設定）進入子畫面時記住來源；子畫面之間切換不覆蓋
  const SUB = ['detail','add','edit'];
  if(SUB.includes(screen) && !SUB.includes(view.screen)) view.back = view.screen;
  if(id) view.detailId = id;
  view.screen = screen;
  render();
  window.scrollTo(0,0);
}

document.addEventListener('click', e=>{
  const t = e.target;
  if(t.closest('[data-sheet]') || t.closest('#toast')) return;
  const done = t.closest('[data-done]'); if(done){ openDone(done.dataset.done); return; }
  const open = t.closest('[data-open]'); if(open){ go('detail', open.dataset.open); return; }
  const tab = t.closest('[data-tab]'); if(tab){ go(tab.dataset.tab); return; }
  const gt = t.closest('[data-goto]'); if(gt){ go(gt.dataset.goto); return; }
  if(t.closest('#protoBtn')){ openProto(); return; }
  if(t.closest('#back')){ go(view.screen==='edit' ? 'detail' : (view.back || 'home')); return; }
  if(t.closest('#fab')){ F = freshForm(); go('add'); return; }
  const th = t.closest('[data-theme-set]'); if(th){ setTheme(th.dataset.themeSet); render(); return; }
  const last = t.closest('[data-last]'); if(last){ F.last = last.dataset.last; render(); return; }
  const fc = t.closest('[data-fcyc]');
  if(fc){ if(fc.dataset.fcyc==='custom') F.custom = true; else { F.custom = false; F.cycle = fc.dataset.fcyc; } F.err=''; render(); return; }
  if(t.closest('[data-label-tg]')){ F.labelOpen = !F.labelOpen; render(); return; }
  if(t.closest('[data-cost-tg]')){ F.costOpen = !F.costOpen; render(); return; }
  if(t.closest('[data-add-shoot]')){ F.photo = true; F.recog = true; F.brand = '3M'; F.model = '淨呼吸 9808'; render(); return; }
  if(t.closest('[data-add-submit]')){ submitAdd(); return; }
  if(t.closest('#pauseBtn')){ openPause(view.detailId); return; }
  const adj = t.closest('[data-adjust]');
  if(adj){
    const it = find(view.detailId), prev = it.logs[0].cycleDays;
    it.logs[0].cycleDays = +adj.dataset.adjust;
    render(); showToast(`目前週期改成 ${adj.dataset.adjust} 天`, ()=>{ it.logs[0].cycleDays = prev; });
    return;
  }
  const pa = t.closest('[data-photo-add]');
  if(pa){ const it = find(pa.dataset.photoAdd); openPhotoPicker('新增物品照片', ()=>{ if(it.photos<5){ it.photos++; render(); showToast('已加入照片'); } }); return; }
  const pv = t.closest('[data-photo-view]');
  if(pv){ const it = find(pv.dataset.photoView); openPhotoView('物品照片', ()=>{ it.photos--; render(); showToast('已刪除照片', ()=>{ it.photos++; }); }); return; }
  if(t.closest('[data-fphoto-add]')){ openPhotoPicker('新增物品照片', ()=>{ if(F.itemPhotos<5){ F.itemPhotos++; render(); } }); return; }
  if(t.closest('[data-fphoto-view]')){ openPhotoView('物品照片', ()=>{ F.itemPhotos--; render(); }); return; }
  const di = t.closest('[data-del-item]'); if(di){ openDeleteItem(di.dataset.delItem); return; }
  if(t.closest('[data-edit-lead]')){ openLeadSetting(); return; }
  // P3：通知與準時提醒的權限只能由系統設定改，app 只能帶使用者過去
  if(t.closest('[data-notif-open]') || (t.closest('[data-notif-row]') && !P3.notif)){ P3.notif = true; render(); showToast('已開啟通知（正式版會打開手機的通知設定）'); return; }
  if(t.closest('[data-notif-row]')){ showToast('要關閉通知，請到手機的系統設定'); return; }
  if(t.closest('[data-exact-row]')){
    if(P3.exact) showToast('要關閉，請到手機的系統設定');
    else { P3.exact = true; render(); showToast('已允許準時提醒（正式版會打開手機的「鬧鐘與提醒」設定）'); }
    return;
  }
  if(t.closest('[data-edit-time]')){ openRemindTime(); return; }
  if(t.closest('[data-export]')){ openExport(); return; }
  if(t.closest('[data-restore]')){ openRestore(); return; }
  if(t.closest('[data-reorder]')){ view.reorderLocs = !view.reorderLocs; render(); return; }
  const mv = t.closest('[data-move]');
  if(mv){ const i = +mv.dataset.move, j = i + (+mv.dataset.dir); [LOCS[i], LOCS[j]] = [LOCS[j], LOCS[i]]; render(); return; }
  const ei = t.closest('[data-edit-item]'); if(ei){ openEdit(ei.dataset.editItem); return; }
  const elg = t.closest('[data-edit-log]'); if(elg){ openLogEdit(view.detailId, +elg.dataset.editLog); return; }
  const ec2 = t.closest('[data-ecyc]');
  if(ec2 && E){ if(ec2.dataset.ecyc==='custom') E.custom = true; else { E.custom = false; E.cycle = ec2.dataset.ecyc; } E.err=''; render(); return; }
  if(t.closest('[data-edit-save]')){ saveEdit(); return; }
  const hf = t.closest('[data-hfilter]'); if(hf){ view.homeFilter = view.homeFilter===hf.dataset.hfilter ? null : hf.dataset.hfilter; render(); return; }
  const tg = t.closest('[data-tog]'); if(tg){ view[tg.dataset.tog] = !view[tg.dataset.tog]; render(); return; }
  const el = t.closest('[data-edit-loc]'); if(el){ openEditPlace('loc', el.dataset.editLoc); return; }
  const ec = t.closest('[data-edit-cat]'); if(ec){ openEditPlace('cat', ec.dataset.editCat); return; }
  if(t.closest('[data-new-loc]')){ openEditPlace('loc', null); return; }
  if(t.closest('[data-new-cat]')){ openEditPlace('cat', null); return; }
  const stub = t.closest('[data-stub]'); if(stub){ showToast(`原型沒有做「${stub.dataset.stub}」`); return; }
});
document.addEventListener('input', e=>{
  const f = e.target.dataset && e.target.dataset.f;
  if(f && !e.target.closest('[data-sheet]')){ F[f] = e.target.value; if(f==='brand'||f==='model') F.recog = false; }
});
document.addEventListener('change', e=>{
  const f = e.target.dataset && e.target.dataset.f;
  if(!f || e.target.closest('[data-sheet]')) return;
  F[f] = e.target.value;
  // 位置、類別改變會影響「會顯示為」預覽與同位置同類別的提示
  if(f==='loc' || f==='cat' || f==='label') render();
});

document.addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.e;
  if(k && E && !e.target.closest('[data-sheet]')) E[k] = e.target.value;
});
document.addEventListener('change', e=>{
  const k = e.target.dataset && e.target.dataset.e;
  if(!k || !E || e.target.closest('[data-sheet]')) return;
  E[k] = e.target.value;
  // 位置、類別、補充名稱改變會影響「會顯示為」預覽與同位置同類別的提示
  if(k==='loc' || k==='cat' || k==='label') render();
});
